[project]
name = "chargeback-defender"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sudharshan jk", email = "sudharshanjk01@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "diskcache>=5.6.3",
    "google-genai>=2.22.0",
    "instructor>=1.16.0",
    "matplotlib>=3.11.1",
    "openai>=2.54.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "structlog>=26.1.0",
]

[project.scripts]
chargeback-defender = "chargeback_defender:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
